<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MoneyAmplifier</title>
  <meta name="theme-color" content="#fbf3e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MoneyAmplifier">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <img class="logo" src="icons/mascot.svg" alt="" width="36" height="36">
    <h1 id="page-title">MoneyAmplifier</h1>
    <a class="icon-btn" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </header>

  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Main">
    <!-- the back end of a Shiba: round bottom, cream fur under the tail, two cheeks -->
    <svg class="butt" viewBox="0 0 360 96" preserveAspectRatio="none" aria-hidden="true">
      <path class="dog-body" d="M2 82 V72 C2 46 26 30 62 28 C100 26 130 32 150 30 C165 28 172 24 180 24 C188 24 195 28 210 30 C230 32 260 26 298 28 C334 30 358 46 358 72 V82 Q358 96 344 96 H16 Q2 96 2 82 Z"/>
      <ellipse class="dog-cream" cx="180" cy="62" rx="46" ry="30"/>
      <path class="dog-crease" d="M124 46 C112 62 114 80 128 92 M236 46 C248 62 246 80 232 92"/>
      <!-- hind paws peeking out underneath -->
      <g class="paw"><ellipse cx="62" cy="97" rx="19" ry="8"/><path d="M55 93 v7 M62 91 v9 M69 93 v7"/></g>
      <g class="paw"><ellipse cx="298" cy="97" rx="19" ry="8"/><path d="M291 93 v7 M298 91 v9 M305 93 v7"/></g>
    </svg>
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>History</span>
    </a>
    <a href="#/add" data-tab="add" class="tab-add" aria-label="Add">
      <!-- the curled tail is the Add button -->
      <svg class="tail" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="tail-body" cx="32" cy="32" r="28"/>
        <path class="tail-curl" d="M52 40 C48 52 36 58 24 55"/>
        <circle class="tail-cream" cx="32" cy="30" r="17"/>
        <path class="tail-plus" d="M32 22 v16 M24 30 h16"/>
      </svg>
      <span>Add</span>
    </a>
    <a href="#/invest" data-tab="invest">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg><span>Invest</span>
    </a>
    <a href="#/wealth" data-tab="wealth">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Net worth</span>
    </a>
  </nav>

  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
