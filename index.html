<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MoneyAmplifier</title>
  <meta name="theme-color" content="#fbf3e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MoneyAmplifier">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <img class="logo" src="icons/mascot.svg" alt="" width="36" height="36">
    <h1 id="page-title">MoneyAmplifier</h1>
    <a class="icon-btn" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </header>

  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Main">
    <!-- a Shiba seen from behind (after the sketch): two paws at the sides, two big cheeks, fluffy belly fur, tail tuft + bum-hole in the middle -->
    <svg class="butt" viewBox="0 0 360 104" preserveAspectRatio="none" aria-hidden="true">
      <!-- hind paws: sole pad + toe beans -->
      <ellipse class="paw" cx="42" cy="70" rx="42" ry="29"/>
      <ellipse class="pad" cx="50" cy="71" rx="28" ry="17"/>
      <circle class="bean" cx="17" cy="59" r="4.5"/><circle class="bean" cx="9" cy="74" r="4.5"/><circle class="bean" cx="21" cy="86" r="4.5"/>
      <ellipse class="paw" cx="318" cy="70" rx="42" ry="29"/>
      <ellipse class="pad" cx="310" cy="71" rx="28" ry="17"/>
      <circle class="bean" cx="343" cy="59" r="4.5"/><circle class="bean" cx="351" cy="74" r="4.5"/><circle class="bean" cx="339" cy="86" r="4.5"/>
      <!-- cheeks -->
      <circle class="cheek" cx="118" cy="48" r="45"/>
      <circle class="cheek" cx="242" cy="48" r="45"/>
      <path class="shine" d="M88 30 C95 21 106 17 117 17 M272 30 C265 21 254 17 243 17"/>
      <path class="line" d="M146 14 C157 14 166 9 171 4 M214 14 C203 14 194 9 189 4"/>
      <!-- lighter, fluffy belly fur under the bum-hole -->
      <path class="belly" d="M166 50 L158 58 L162 61 L153 72 L157 75 L148 87 L153 90 L145 101 L153 100 L158 95 L163 102 L169 96 L174 103 L180 96 L186 103 L191 96 L197 102 L202 95 L207 100 L215 101 L207 90 L212 87 L203 75 L207 72 L198 61 L202 58 L194 50 Z"/>
      <path class="hair-cream" d="M160 66 l-9 -3 M155 80 l-10 -2 M150 94 l-9 0 M200 66 l9 -3 M205 80 l10 -2 M210 94 l9 0"/>
      <path class="hair-tan" d="M172 66 l-2 9 M180 70 l1 10 M188 66 l2 9 M175 86 l-1 8 M185 84 l2 8"/>
    </svg>
    <a href="#/invest" data-tab="invest">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg><span>Invest</span>
    </a>
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
    </a>
    <a href="#/add" data-tab="add" class="tab-add" aria-label="Add">
      <!-- tail tuft sticking up, behind the bum-hole -->
      <svg class="tail" viewBox="0 0 40 46" aria-hidden="true"><path class="tuft" d="M2 45 C10 43 8 38 8 32 C8 24 16 22 17 16 C18 10 19 6 20 1 C21 6 22 10 23 16 C24 22 32 24 32 32 C32 38 30 43 38 45"/></svg>
      <!-- the "+" is the bum-hole -->
      <svg class="hole" viewBox="0 0 48 48" aria-hidden="true"><circle class="skin" cx="24" cy="24" r="22"/><circle class="ring" cx="24" cy="24" r="15"/><path class="plus" d="M24 14 v20 M14 24 h20"/></svg>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>History</span>
    </a>
    <a href="#/wealth" data-tab="wealth">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Profile</span>
    </a>
  </nav>

  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
