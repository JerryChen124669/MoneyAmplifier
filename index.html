<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MoneyAmplifier</title>
  <meta name="theme-color" content="#f1ede7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MoneyAmplifier">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="page-title">MoneyAmplifier</h1>
    <a class="icon-btn" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </header>

  <main id="view"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Main">
    <!-- a Shiba seen from behind (after the sketch): two paws at the sides, two big cheeks, fluffy belly fur, tail tuft + bum-hole in the middle -->
    <svg class="butt" viewBox="0 0 360 104" preserveAspectRatio="none" aria-hidden="true">
      
      <!-- hind paws: sole pad + toe beans -->
      <ellipse class="paw" cx="42" cy="70" rx="42" ry="29"/>
      <ellipse class="pad" cx="50" cy="71" rx="28" ry="17"/>
      <circle class="bean" cx="17" cy="59" r="4.5"/><circle class="bean" cx="9" cy="74" r="4.5"/><circle class="bean" cx="21" cy="86" r="4.5"/>
      <ellipse class="paw" cx="318" cy="70" rx="42" ry="29"/>
      <ellipse class="pad" cx="310" cy="71" rx="28" ry="17"/>
      <circle class="bean" cx="343" cy="59" r="4.5"/><circle class="bean" cx="351" cy="74" r="4.5"/><circle class="bean" cx="339" cy="86" r="4.5"/>
      <!-- tan "saddle" on the back: its top sweeps down into the tail valley -->
      <path class="rump" d="M66 64 C64 32 88 6 122 5 C142 5 160 9 170 19 C175 23 185 23 190 19 C200 9 218 5 238 5 C272 6 296 32 294 64 C293 86 276 101 246 101 H114 C84 101 67 86 66 64 Z"/>
      <!-- white cheeks and belly: one flat shape (the middle is the same colour as the cheeks) -->
      <path class="lobe" d="M72 64 C70 40 88 22 116 21 C140 21 160 29 171 43 C175 48 178 51 180 54 C182 51 185 48 189 43 C200 29 220 21 244 21 C272 22 290 40 288 64 C286 86 270 99 242 99 H118 C90 99 74 86 72 64 Z"/>
      <path class="gloss" d="M88 44 C93 34 103 29 114 29 M272 44 C267 34 257 29 246 29"/>
    </svg>
    <a href="#/invest" data-tab="invest">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg><span>Invest</span>
    </a>
    <a href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
    </a>
    <a href="#/add" data-tab="add" class="tab-add" aria-label="Add">
      <!-- tail tuft sticking up, behind the bum-hole -->
      <svg class="tail" viewBox="0 0 46 36" aria-hidden="true">
        <defs><clipPath id="tailClip"><path d="M4 36 C3 29 7 24 11 21 C8 13 14 5 24 5 C34 5 41 12 38 20 C41 24 43 30 42 36 Z"/></clipPath></defs>
        <g clip-path="url(#tailClip)">
          <rect class="tfill" width="46" height="36"/>
          <path class="tstripe" d="M0 36 V16 C6 15 12 19 16 24 C22 27 30 26 46 26 V36 Z"/>
        </g>
        <path class="tuft" d="M4.6 31 C5 27 8 23.5 11 21 C8 13 14 5 24 5 C34 5 41 12 38 20 C40.5 23 41.5 27 41.4 31"/>
        <path class="tgloss" d="M17 14 C19 10 22 8.5 26 8.5"/>
      </svg>
      <!-- the "+" is the bum-hole -->
      <svg class="hole" viewBox="0 0 40 40" aria-hidden="true">
        <defs><radialGradient id="holeShade"><stop offset="0" stop-color="#b9695a" stop-opacity="0.8"/><stop offset="0.55" stop-color="#cc8a76" stop-opacity="0.45"/><stop offset="1" stop-color="#d9a290" stop-opacity="0"/></radialGradient></defs>
        <circle cx="20" cy="20" r="19" fill="url(#holeShade)"/>
        <ellipse cx="27" cy="29" rx="6.5" ry="2.6" transform="rotate(-38 27 29)" fill="#fff" opacity="0.75"/>
        <path class="plus" d="M20 12 v16 M12 20 h16"/>
      </svg>
    </a>
    <a href="#/history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>History</span>
    </a>
    <a href="#/wealth" data-tab="wealth">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg><span>Profile</span>
    </a>
  </nav>

  <script src="vendor/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
