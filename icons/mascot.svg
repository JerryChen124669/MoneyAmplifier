<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="200" height="190">
  <!-- Shiba Inu mascot (transparent background), used inside the app -->
  <defs>
    <path id="face" d="M100 40 C140 40 174 62 182 94 L192 100 L184 111 L192 124 L180 130 L183 148 L165 149 C150 167 126 175 100 175 C74 175 50 167 35 149 L17 148 L20 130 L8 124 L16 111 L8 100 L18 94 C26 62 60 40 100 40 Z"/>
    <clipPath id="faceclip"><use href="#face"/></clipPath>
  </defs>
  <g stroke="#7a4b2a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <path d="M26 90 C12 58 20 30 44 20 C66 24 84 40 92 58 Z" fill="#dc9a55"/>
    <path d="M174 90 C188 58 180 30 156 20 C134 24 116 40 108 58 Z" fill="#dc9a55"/>
    <path d="M35 74 C30 54 35 40 44 32 C57 37 68 46 74 58 Z" fill="#fbe3c8" stroke="none"/>
    <path d="M165 74 C170 54 165 40 156 32 C143 37 132 46 126 58 Z" fill="#fbe3c8" stroke="none"/>
    <!-- head: orange with fluffy cheeks -->
    <use href="#face" fill="#e3a561"/>
    <!-- cream mask: cheeks, muzzle, chin -->
    <g clip-path="url(#faceclip)" stroke="none">
      <path d="M0 124 C12 104 40 100 62 116 C76 124 90 118 100 106 C110 118 124 124 138 116 C160 100 188 104 200 124 L200 190 L0 190 Z" fill="#fff4e2"/>
    </g>
    <use href="#face" fill="none"/>
  </g>
  <!-- four-eyes spots -->
  <ellipse cx="64" cy="79" rx="8" ry="5" fill="#fbe3c8"/>
  <ellipse cx="136" cy="79" rx="8" ry="5" fill="#fbe3c8"/>
  <!-- eyes -->
  <ellipse cx="64" cy="100" rx="8.5" ry="10.5" fill="#3a2214"/>
  <ellipse cx="136" cy="100" rx="8.5" ry="10.5" fill="#3a2214"/>
  <circle cx="67" cy="96" r="3.6" fill="#fff"/>
  <circle cx="139" cy="96" r="3.6" fill="#fff"/>
  <circle cx="61" cy="105" r="1.7" fill="#fff" opacity=".85"/>
  <circle cx="133" cy="105" r="1.7" fill="#fff" opacity=".85"/>
  <!-- blush -->
  <ellipse cx="38" cy="128" rx="12" ry="7" fill="#f4a58a" opacity=".6"/>
  <ellipse cx="162" cy="128" rx="12" ry="7" fill="#f4a58a" opacity=".6"/>
  <!-- open smile with tongue -->
  <path d="M85 141 C88 162 112 162 115 141 Z" fill="#5a2a22" stroke="#3a2214" stroke-width="3" stroke-linejoin="round"/>
  <path d="M91 153 C95 163 105 163 109 153 C104 149 96 149 91 153 Z" fill="#f08a8a"/>
  <!-- nose -->
  <path d="M88 125 h24 c0 8 -7 13 -12 13 c-5 0 -12 -5 -12 -13 z" fill="#3a2214"/>
  <ellipse cx="96" cy="128" rx="3.5" ry="1.7" fill="#fff" opacity=".35"/>
  <path d="M100 138 v4" stroke="#3a2214" stroke-width="3" stroke-linecap="round"/>
</svg>
