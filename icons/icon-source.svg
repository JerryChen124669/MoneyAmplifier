<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MoneyAmplifier app icon: a cute, minimal flower. Replace this file (or add icon-source.png, 1024x1024), then run: npm run icons -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ede3"/>
      <stop offset="1" stop-color="#e3d6c6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(0 26)">
    <!-- two small leaves -->
    <path d="M256 330 C226 342 190 362 170 392 C206 396 244 380 256 330 Z" fill="#9fb4a0"/>
    <path d="M256 330 C286 342 322 362 342 392 C306 396 268 380 256 330 Z" fill="#b2c4b1"/>
    <!-- five round petals -->
    <g fill="#dba9a2">
      <circle cx="256" cy="154" r="66"/>
      <circle cx="334" cy="211" r="66"/>
      <circle cx="304" cy="302" r="66"/>
      <circle cx="208" cy="302" r="66"/>
      <circle cx="178" cy="211" r="66"/>
    </g>
    <!-- soft highlight on each petal -->
    <g fill="#ebc7c0">
      <circle cx="256" cy="136" r="34"/>
      <circle cx="350" cy="204" r="34"/>
      <circle cx="314" cy="316" r="34"/>
      <circle cx="198" cy="316" r="34"/>
      <circle cx="162" cy="204" r="34"/>
    </g>
    <!-- face -->
    <circle cx="256" cy="236" r="58" fill="#f3e3b3"/>
    <circle cx="256" cy="236" r="58" fill="none" stroke="#e6cd8c" stroke-width="6"/>
    <circle cx="237" cy="230" r="6" fill="#6b5a50"/>
    <circle cx="275" cy="230" r="6" fill="#6b5a50"/>
    <circle cx="224" cy="246" r="8" fill="#e8a99f" opacity=".65"/>
    <circle cx="288" cy="246" r="8" fill="#e8a99f" opacity=".65"/>
    <path d="M245 246 Q256 258 267 246" fill="none" stroke="#6b5a50" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
